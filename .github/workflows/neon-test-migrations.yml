name: Neon test database migrations

# Manual only: applies the Drizzle migrations and the permission catalog to the temporary Neon
# TEST database (docs/TEST-ENVIRONMENT.md §5). Never deploys. Never used for production.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate-neon-test" to apply migrations and the permission seed to the Neon test database'
        required: true
        type: string

permissions:
  contents: read

# One run at a time; a second run waits instead of migrating concurrently.
concurrency:
  group: neon-test-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and seed the Neon test database
    # Trusted code only: the workflow must be started from main of this repository.
    if: github.ref == 'refs/heads/main' && github.repository == 'alvoxis/alvoxis-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional extra gate: restrict this environment to main (and add a reviewer) in the
    # repository settings, and store NEON_TEST_DATABASE_URL (secret) and NEON_TEST_DB_HOST
    # (variable: the test project's direct endpoint host, not a secret) there.
    environment: neon-test
    steps:
      # No secret in these steps. Only trusted code from main is checked out (see `if` above).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Before any connection: the confirmation, then scripts/ci/neon-test-url.ts (exact direct
      # endpoint host from NEON_TEST_DB_HOST, no pooler, only sslmode/channel_binding parameters,
      # sslmode=require or verify-full). It runs with plain Node and prints no values.
      - name: Check the confirmation and the connection settings
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          NEON_TEST_DB_HOST: ${{ vars.NEON_TEST_DB_HOST }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "migrate-neon-test" ]; then
            echo "::error::Confirmation text does not match; nothing was done."
            exit 1
          fi
          node --no-warnings scripts/ci/neon-test-url.ts check

      # The secret is not in the environment of the install step.
      - run: pnpm install --frozen-lockfile

      # The normalized URL (sslmode=require tightened to verify-full) only lives in a shell
      # variable of each step: masked, never written to a file or GITHUB_ENV, never printed.
      - name: Apply migrations (pnpm db:migrate)
        shell: bash
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          NEON_TEST_DB_HOST: ${{ vars.NEON_TEST_DB_HOST }}
        run: |
          set -euo pipefail
          url="$(node --no-warnings scripts/ci/neon-test-url.ts print)"
          echo "::add-mask::$url"
          DATABASE_URL="$url" pnpm db:migrate

      - name: Sync the permission catalog (pnpm db:seed)
        shell: bash
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          NEON_TEST_DB_HOST: ${{ vars.NEON_TEST_DB_HOST }}
        run: |
          set -euo pipefail
          url="$(node --no-warnings scripts/ci/neon-test-url.ts print)"
          echo "::add-mask::$url"
          DATABASE_URL="$url" pnpm db:seed
